<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6f42">
<link rel="manifest" href="manifest.json">
<title>Servis Takip</title>
<style>
:root{--bg:#f3f0e8;--card:#fff;--tx:#1c1b18;--mut:#706c62;--bd:#d9d4c7;--ac:#1d6f42;--acbg:#e1f1e8;--alt:#f8f6f0;--dng:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1c1c1a;--tx:#ecebe6;--mut:#9b978c;--bd:#38362f;--ac:#52c488;--acbg:#1d3a2b;--alt:#222220;--dng:#f2837b}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:520px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,#1d6f42,#2f8f5b);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero h1{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.85;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600}
.nav{display:flex;gap:8px;align-items:center}
.nav button,.btn{border:1.5px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer}
.nav input{flex:1;min-width:0;font:inherit;padding:10px;border:1.5px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
.big{font-size:19px;font-weight:700;margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--bd);background:transparent;color:var(--tx);padding:10px 16px;border-radius:999px;font-size:16px;cursor:pointer}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:700}
.chip.add{border-style:dashed;color:var(--mut)}
.note{width:100%;margin-top:12px;font:inherit;padding:10px;border:1.5px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:360px;font-size:14px}
th{background:#1d6f42;color:#fff;text-align:left;padding:8px 10px;border:1px solid var(--bd)}
td{padding:8px 10px;border:1px solid var(--bd)}
tr:nth-child(even) td{background:var(--alt)}
tr.cur td{outline:2px solid var(--ac);outline-offset:-2px}
td.e{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:var(--dng)}
#msg{font-size:13px;color:var(--mut);min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
<div class="hero"><h1>🚌 Servis Takip</h1><p>Personel servis güzergahları, gün gün</p></div>

<div class="card">
<h2>Tarih</h2>
<div class="nav"><button id="pv" aria-label="Önceki gün">‹</button><input type="date" id="dp"><button id="nx" aria-label="Sonraki gün">›</button></div>
<div class="big" id="lb"></div>
<div class="chips" id="ch"></div>
<input class="note" id="nt" placeholder="Not (servis, plaka, şoför…)">
<div class="row"><button class="btn d" id="clr">Bu günü temizle</button><button class="btn" id="tod">Bugün</button></div>
</div>

<div class="card">
<h2 id="wt">Haftalık tablo</h2>
<div class="wrap"><table><thead><tr><th>Tarih</th><th>Gün</th><th>Güzergah</th><th>Not</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="row"><button class="btn p" id="cw">Haftayı kopyala (Excel)</button><button class="btn" id="ca">Tüm kayıtları kopyala</button></div>
<div id="msg"></div>
</div>
</div>
<script>
var G=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
var st={routes:["Buca","Torbalı","Ayrancılar"],days:{}};
try{var raw=localStorage.getItem("servisTakip1");if(raw)st=JSON.parse(raw)}catch(e){}
if(!st.routes||!st.days){st={routes:["Buca","Torbalı","Ayrancılar"],days:{}}}
function save(){try{localStorage.setItem("servisTakip1",JSON.stringify(st))}catch(e){}}
function p2(n){return ("0"+n).slice(-2)}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function fmt(d){return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear()}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function monday(d){return add(d,-((d.getDay()+6)%7))}
var cur=iso(new Date());
function get(k){return st.days[k]||{r:[],n:""}}
function txt(k){return get(k).r.join(" - ")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
var $=function(i){return document.getElementById(i)};
function draw(){
var d=parse(cur);
$("dp").value=cur;
$("lb").textContent=G[d.getDay()]+", "+fmt(d);
var h="",g=get(cur);
st.routes.forEach(function(r){var on=g.r.indexOf(r)>-1;
h+='<button class="chip'+(on?' on':'')+'" data-r="'+esc(r)+'">'+(on?'✓ ':'')+esc(r)+'</button>'});
h+='<button class="chip add" id="ad">+ Güzergah</button>';
$("ch").innerHTML=h;
$("nt").value=g.n||"";
var m=monday(d);
$("wt").textContent="Hafta: "+fmt(m)+" – "+fmt(add(m,5));
var t="";
for(var i=0;i<6;i++){var x=add(m,i),k=iso(x),v=txt(k);
t+='<tr'+(k===cur?' class="cur"':'')+'><td>'+fmt(x)+'</td><td>'+G[x.getDay()]+'</td><td'+(v?'':' class="e"')+'>'+(esc(v)||'—')+'</td><td>'+esc(get(k).n||"")+'</td></tr>'}
$("tb").innerHTML=t;
}
$("ch").addEventListener("click",function(e){
var c=e.target.closest(".chip");if(!c)return;
if(c.id==="ad"){var n;try{n=prompt("Yeni güzergah adı:")}catch(x){}
n=(n||"").trim();if(n&&st.routes.indexOf(n)<0){st.routes.push(n);save();draw()}return}
var r=c.dataset.r,g=get(cur),k=g.r.indexOf(r);
if(k>-1)g.r.splice(k,1);else g.r.push(r);
g.r.sort(function(a,b){return st.routes.indexOf(a)-st.routes.indexOf(b)});
st.days[cur]=g;save();draw()});
$("nt").addEventListener("input",function(){var g=get(cur);g.n=$("nt").value;st.days[cur]=g;save();
var m=monday(parse(cur)),rows=$("tb").rows;rows[(parse(cur).getDay()+6)%7].cells[3].textContent=g.n});
$("dp").onchange=function(){if($("dp").value){cur=$("dp").value;draw()}};
$("pv").onclick=function(){cur=iso(add(parse(cur),-1));draw()};
$("nx").onclick=function(){cur=iso(add(parse(cur),1));draw()};
$("tod").onclick=function(){cur=iso(new Date());draw()};
$("clr").onclick=function(){delete st.days[cur];save();draw()};
function cp(s,ok){var m=$("msg");
try{navigator.clipboard.writeText(s).then(function(){m.textContent=ok},function(){m.textContent="Kopyalanamadı. Tablonun ekran görüntüsünü alın."})}
catch(x){m.textContent="Kopyalanamadı. Tablonun ekran görüntüsünü alın."}}
$("cw").onclick=function(){var m=monday(parse(cur)),s="Tarih\tGün\tGüzergah\tNot\n";
for(var i=0;i<6;i++){var x=add(m,i),k=iso(x);s+=fmt(x)+"\t"+G[x.getDay()]+"\t"+txt(k)+"\t"+(get(k).n||"")+"\n"}
cp(s,"Hafta kopyalandı. Excel’e yapıştırın.")};
$("ca").onclick=function(){var s="Tarih\tGün\tGüzergah\tNot\n";
Object.keys(st.days).sort().forEach(function(k){var x=parse(k);s+=fmt(x)+"\t"+G[x.getDay()]+"\t"+txt(k)+"\t"+(get(k).n||"")+"\n"});
cp(s,"Tüm kayıtlar kopyalandı.")};
draw();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
</script>
</body>
</html>
